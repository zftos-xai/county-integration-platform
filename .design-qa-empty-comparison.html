<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外部系统空状态对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #eef2f3; color: #20333e; font: 14px/1.5 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    section { min-width: 0; padding: 16px; border: 1px solid #d8e1e4; border-radius: 8px; background: #fff; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    img { width: 100%; height: auto; border: 1px solid #e2e8ea; display: block; }
  </style>
</head>
<body>
  <main>
    <section><h2>修改前：空数据仍展示完整操作框架</h2><img src=".design-qa-empty-source.png" alt="修改前外部系统空状态" /></section>
    <section><h2>修改后：只保留首个必要操作</h2><img src=".design-qa-empty-state.jpg" alt="修改后外部系统空状态" /></section>
  </main>
</body>
</html>
