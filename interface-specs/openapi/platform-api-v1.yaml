openapi: 3.0.3
info:
  title: 县域系统集成平台管理接口
  version: 0.1.0
  description: >-
    OpenAPI 是用机器可读文件说明 HTTP 接口的通用规范。本文件描述当前平台内部管理接口。
    业务接口只有在接口规范、已删除或遮盖敏感字段的样例、网络条件和负责人均确认后才能开发。
servers:
  - url: /api/v1
security:
  - hospitalIdentity: []
paths:
  /bootstrap/status:
    get:
      security: []
      operationId: getBootstrapStatus
      summary: 查询是否可以创建首个机构和管理员
      responses:
        '200':
          description: 是否可以初始化，不包含凭证内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapStatusResponse' }
  /bootstrap:
    post:
      security: []
      operationId: bootstrapPlatform
      summary: 仅创建一次首个机构和本地管理员
      parameters:
        - name: X-Platform-Bootstrap-Secret
          in: header
          required: true
          description: 仅通过获准部署渠道提供的一次性密码
          schema: { type: string, minLength: 32 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapRequest' }
      responses:
        '201': { description: 已创建首个机构和管理员 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 当前不能初始化，或一次性密码无效 }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /session/csrf:
    get:
      security: []
      operationId: getCsrfToken
      summary: 获取修改数据请求所需的跨站请求伪造防护令牌（CSRF Token）
      responses:
        '200':
          description: CSRF Token 及其请求头名称
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenResponse' }
  /session/login:
    post:
      security: []
      operationId: login
      summary: 登录并建立服务端管理会话
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 已登录的当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { description: 登录名或密码错误 }
  /session/current:
    get:
      operationId: getCurrentUser
      summary: 查询当前登录的管理用户
      responses:
        '200':
          description: 当前用户，不包含密码或会话编号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /session/logout:
    post:
      operationId: logout
      summary: 退出并使当前管理会话失效
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': { description: 当前会话已失效 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /session/password:
    post:
      operationId: changeCurrentPassword
      summary: 修改当前本地密码并使当前会话失效
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: 密码已修改，用户必须重新登录 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      operationId: listUsers
      summary: 查询主要机构在当前账号可访问范围内的用户
      responses:
        '200':
          description: 当前账号可查看的平台用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '403': { description: 'identity:read permission is required' }
    post:
      operationId: createUser
      summary: 在当前账号可管理的机构中创建本地用户
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201': { description: 已创建用户，首次登录必须修改密码 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'identity:write permission and organization scope are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getUser
      summary: 查询当前账号有权查看的平台用户
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '403': { description: 'identity:read permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    put:
      operationId: updateUser
      summary: 修改用户显示名称和主要机构
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200': { description: 已修改用户 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'identity:write permission and both organization scopes are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /users/{userId}/enabled:
    patch:
      operationId: changeUserEnabled
      summary: 启用或停用用户，同时保留至少一个可用管理员
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeEnabledRequest' }
      responses:
        '200': { description: 已修改用户状态 }
        '403': { description: 'identity:write permission and organization scope are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /users/{userId}/password-reset:
    post:
      operationId: resetUserPassword
      summary: 设置临时密码并使该用户的现有会话权限失效
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: 已设置临时密码 }
        '403': { description: 'identity:write permission and organization scope are required' }
  /users/{userId}/roles:
    put:
      operationId: replaceUserRoles
      summary: 一次性替换用户角色，同时保留至少一个可用管理员
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceRoleIdsRequest' }
      responses:
        '200': { description: 已替换用户角色 }
        '403': { description: 'access:write permission and organization scope are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /users/{userId}/organization-scopes:
    put:
      operationId: replaceUserOrganizationScopes
      summary: 在当前操作人可访问的机构内一次性替换用户可访问机构
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceOrganizationIdsRequest' }
      responses:
        '200': { description: 已替换用户可访问机构 }
        '403': { description: 'access:write permission and all organization scopes are required' }
  /roles:
    get:
      operationId: listRoles
      summary: 查询平台角色和后端已登记权限
      responses:
        '200':
          description: 平台角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListResponse' }
        '403': { description: 'access:read permission is required' }
    post:
      operationId: createRole
      summary: 创建非系统保护角色
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201': { description: 已创建角色 }
        '403': { description: 'access:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getRole
      summary: 查询平台角色
      responses:
        '200': { description: 角色详情 }
        '403': { description: 'access:read permission is required' }
    put:
      operationId: updateRole
      summary: 修改非系统保护角色
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200': { description: 已修改角色 }
        '403': { description: 'access:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
    delete:
      operationId: deleteRole
      summary: 删除未分配给用户的非系统保护角色
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteVersionRequest' }
      responses:
        '200': { description: 角色已删除 }
        '403': { description: 'access:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /roles/{roleId}/permissions:
    put:
      operationId: replaceRolePermissions
      summary: 替换非系统保护角色的已登记权限
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacePermissionCodesRequest' }
      responses:
        '200': { description: 已替换角色权限 }
        '403': { description: 'access:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /permissions:
    get:
      operationId: listRegisteredPermissions
      summary: 查询后端代码已登记的权限
      responses:
        '200': { description: 后端已登记的权限列表 }
        '403': { description: 'access:read permission is required' }
  /system/info:
    get:
      operationId: getPlatformInfo
      summary: 查询当前运行的平台版本和数据库信息
      responses:
        '200':
          description: 平台信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /exchange-records:
    get:
      operationId: findRecentExchangeRecords
      summary: 查询当前账号有权访问机构的近期交换记录
      parameters:
        - name: organizationCode
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: receivedFrom
          in: query
          required: false
          description: 接收时间下限，使用协调世界时（UTC），包含该时刻
          schema: { type: string, format: date-time }
        - name: receivedTo
          in: query
          required: false
          description: 接收时间上限，使用协调世界时（UTC），包含该时刻
          schema: { type: string, format: date-time }
        - name: interfaceCode
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: sourceRecordId
          in: query
          required: false
          description: 不包含临床正文的业务记录编号
          schema: { type: string, maxLength: 128 }
        - name: requestId
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: result
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ExchangeResult' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 交换记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRecordListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前账号无权访问该机构或数据范围
  /organizations:
    get:
      operationId: listOrganizations
      summary: 查询平台管理的机构
      parameters:
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: 当前管理员可查看的机构
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:read permission is required' }
    post:
      operationId: createOrganization
      summary: 创建平台管理的机构
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: 已创建机构
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getOrganization
      summary: 查询平台管理的机构
      responses:
        '200':
          description: 已找到机构
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:read permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    put:
      operationId: updateOrganization
      summary: 修改机构；如果期间已被他人修改则拒绝保存
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganizationRequest' }
      responses:
        '200':
          description: 已修改机构
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /organizations/{id}/enabled:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    patch:
      operationId: changeOrganizationEnabled
      summary: 启用或停用平台管理的机构
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeOrganizationEnabledRequest' }
      responses:
        '200':
          description: 已修改机构状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/parameter-definitions:
    get:
      operationId: listParameterDefinitions
      summary: 查询代码中登记的平台参数定义
      responses:
        '200':
          description: 用于生成明确管理表单的已登记参数定义
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterDefinitionListResponse' }
        '403': { description: 'configuration:read permission is required' }
  /configuration/parameters:
    get:
      operationId: listParameterValues
      summary: 查询全局参数值和当前账号有权访问的机构参数值
      responses:
        '200':
          description: 当前管理员可查看的参数值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterValueListResponse' }
        '403': { description: 'configuration:read permission is required' }
  /configuration/parameters/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z][a-z0-9_.-]*$' }
    put:
      operationId: upsertParameterValue
      summary: 新增或修改代码中已登记的参数值；如果期间已被他人修改则拒绝保存
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertParameterRequest' }
      responses:
        '200':
          description: 参数值已保存；敏感值仅返回固定遮盖符号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterValueResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission and organization scope are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
    delete:
      operationId: deleteParameterValue
      summary: 删除当前环境和机构范围的参数值，使该范围恢复为尚未配置
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteParameterRequest' }
      responses:
        '200': { description: 当前范围的参数值已删除 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/dictionaries:
    get:
      operationId: listDictionaryTypes
      summary: 查询平台数据字典类型
      responses:
        '200':
          description: 平台数据字典类型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryTypeListResponse' }
        '403': { description: 'configuration:read permission is required' }
    post:
      operationId: createDictionaryType
      summary: 创建平台数据字典类型
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDictionaryTypeRequest' }
      responses:
        '201':
          description: 已创建字典类型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryTypeResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/dictionaries/{typeId}:
    parameters:
      - name: typeId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: updateDictionaryType
      summary: 修改或停用字典类型；如果期间已被他人修改则拒绝保存
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDictionaryTypeRequest' }
      responses:
        '200':
          description: 已修改字典类型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryTypeResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
    delete:
      operationId: deleteDictionaryType
      summary: 删除不含任何字典项的字典类型
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteVersionRequest' }
      responses:
        '200': { description: 字典类型已删除 }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/dictionaries/{typeId}/items:
    parameters:
      - name: typeId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: listDictionaryItems
      summary: 查询指定字典类型中的字典项
      parameters:
        - name: includeDisabled
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 按显示顺序和字典项代码排列的字典项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItemListResponse' }
        '403': { description: 'configuration:read permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    post:
      operationId: createDictionaryItem
      summary: 向已启用的字典类型新增字典项
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDictionaryItemRequest' }
      responses:
        '201':
          description: 已创建字典项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItemResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/dictionary-items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: updateDictionaryItem
      summary: 修改或停用字典项；如果期间已被他人修改则拒绝保存
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDictionaryItemRequest' }
      responses:
        '200':
          description: 已修改字典项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItemResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
    delete:
      operationId: deleteDictionaryItem
      summary: 删除未被业务数据引用的字典项
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteVersionRequest' }
      responses:
        '200': { description: 字典项已删除 }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/external-systems:
    get:
      operationId: listExternalSystems
      summary: 查询已确认的外部系统
      responses:
        '200': { description: 外部系统列表, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSystemListResponse' } } } }
        '403': { description: 'configuration:read permission is required' }
    post:
      operationId: createExternalSystem
      summary: 登记已确认的外部系统
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExternalSystemRequest' } } } }
      responses:
        '201': { description: 已创建外部系统, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSystemResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/external-systems/{systemId}:
    parameters:
      - { name: systemId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: updateExternalSystem
      summary: 修改或停用外部系统；如果期间已被他人修改则拒绝保存
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateExternalSystemRequest' } } } }
      responses:
        '200': { description: 已修改外部系统, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSystemResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/external-systems/{systemId}/endpoints:
    parameters:
      - { name: systemId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: listExternalEndpoints
      summary: 查询全局服务地址和当前账号有权访问的机构服务地址
      responses:
        '200': { description: 不包含凭证引用的服务地址资料, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalEndpointListResponse' } } } }
        '403': { description: 'configuration:read permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    post:
      operationId: createExternalEndpoint
      summary: 创建默认停用的服务地址，待检查后再启用
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExternalEndpointRequest' } } } }
      responses:
        '201': { description: 已创建默认停用的服务地址, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalEndpointResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/external-endpoints/{endpointId}:
    parameters:
      - { name: endpointId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: updateExternalEndpoint
      summary: 修改或启用当前账号有权管理的服务地址；如果期间已被他人修改则拒绝保存
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateExternalEndpointRequest' } } } }
      responses:
        '200': { description: 不包含凭证引用的服务地址资料, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalEndpointResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /audit/events:
    get:
      operationId: listManagementAuditEvents
      summary: 查询当前账号可访问机构内的管理操作审计记录
      parameters:
        - { name: actorLogin, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: actionCode, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: targetType, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: targetId, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: requestId, in: query, required: false, description: 精确查询同一次请求留下的记录, schema: { type: string, maxLength: 128 } }
        - { name: resultCode, in: query, required: false, schema: { type: string, enum: [SUCCESS, FAILURE] } }
        - { name: occurredFrom, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: occurredTo, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: beforeOccurredAt, in: query, required: false, description: 与beforeId同时提供，用于继续读取更早记录, schema: { type: string, format: date-time } }
        - { name: beforeId, in: query, required: false, description: 与beforeOccurredAt同时提供，用于处理相同时间的稳定排序, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: 按时间倒序排列且已删除或遮盖敏感字段的审计记录, content: { application/json: { schema: { $ref: '#/components/schemas/ManagementAuditEventListResponse' } } } }
        '403': { description: 'audit:read permission is required' }
components:
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: 由 GET /session/csrf 返回，并与 XSRF-TOKEN Cookie 配套使用的令牌
      schema: { type: string }
  securitySchemes:
    hospitalIdentity:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        Cookie marker for an authenticated management session. The first development
        phase uses a server-side local-management session and secure HttpOnly cookie;
        production identity must be reviewed by the hospital before activation.
  responses:
    InvalidRequest:
      description: 请求参数校验未通过
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: 必须先登录
    ResourceNotFound:
      description: 请求的平台数据不存在，或当前账号无权查看
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ResourceConflict:
      description: 唯一值重复、当前状态不允许操作，或数据已被他人修改
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    BootstrapStatusResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: object
          required: [initialized, bootstrapAvailable]
          properties:
            initialized: { type: boolean }
            bootstrapAvailable: { type: boolean }
    BootstrapRequest:
      type: object
      required: [organizationCode, organizationName, organizationType, loginName, displayName, initialPassword]
      properties:
        organizationCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        organizationType: { type: string, minLength: 1, maxLength: 32 }
        loginName: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        initialPassword: { type: string, minLength: 12, maxLength: 128, format: password, writeOnly: true }
    LoginRequest:
      type: object
      required: [loginName, password]
      properties:
        loginName: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128, format: password, writeOnly: true }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, format: password, writeOnly: true }
        newPassword: { type: string, minLength: 12, maxLength: 128, format: password, writeOnly: true }
    CurrentUserResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/CurrentUser' }
    CurrentUser:
      type: object
      required: [userId, loginName, displayName, primaryOrganizationId, organizationCode, mustChangePassword, permissions, organizationCodes]
      properties:
        userId: { type: integer, format: int64 }
        loginName: { type: string }
        displayName: { type: string }
        primaryOrganizationId: { type: integer, format: int64 }
        organizationCode: { type: string }
        mustChangePassword: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        organizationCodes:
          type: array
          description: 明确列出的已启用机构；可访问上级机构不表示自动获得下级机构权限
          items: { type: string }
    CsrfTokenResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: object
          required: [headerName, parameterName, token]
          properties:
            headerName: { type: string, example: X-XSRF-TOKEN }
            parameterName: { type: string, example: _csrf }
            token: { type: string }
    UserListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/ManagedUser' }
    UserResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/ManagedUser' }
    ManagedUser:
      type: object
      required: [id, loginName, displayName, primaryOrganizationId, organizationCode, enabled, mustChangePassword, createdAt, updatedAt, version, roleIds, organizationScopeIds]
      properties:
        id: { type: integer, format: int64 }
        loginName: { type: string }
        displayName: { type: string }
        primaryOrganizationId: { type: integer, format: int64 }
        organizationCode: { type: string }
        enabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: string, format: byte }
        roleIds: { type: array, items: { type: integer, format: int64 } }
        organizationScopeIds: { type: array, items: { type: integer, format: int64 } }
    CreateUserRequest:
      type: object
      required: [loginName, displayName, primaryOrganizationId, temporaryPassword]
      properties:
        loginName: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        primaryOrganizationId: { type: integer, format: int64, minimum: 1 }
        temporaryPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128 }
    UpdateUserRequest:
      type: object
      required: [displayName, primaryOrganizationId, version]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        primaryOrganizationId: { type: integer, format: int64, minimum: 1 }
        version: { type: string, format: byte }
    ChangeEnabledRequest:
      type: object
      required: [enabled, version]
      properties:
        enabled: { type: boolean }
        version: { type: string, format: byte }
    ResetPasswordRequest:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128 }
    ReplaceRoleIdsRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds: { type: array, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
    ReplaceOrganizationIdsRequest:
      type: object
      required: [organizationIds]
      properties:
        organizationIds: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
    RoleListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/Role' } }
    Role:
      type: object
      required: [id, roleCode, roleName, enabled, systemManaged, createdAt, updatedAt, version, permissionCodes]
      properties:
        id: { type: integer, format: int64 }
        roleCode: { type: string }
        roleName: { type: string }
        enabled: { type: boolean }
        systemManaged: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: string, format: byte }
        permissionCodes: { type: array, items: { type: string } }
    CreateRoleRequest:
      type: object
      required: [roleCode, roleName]
      properties:
        roleCode: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Z][A-Z0-9_]+$' }
        roleName: { type: string, minLength: 1, maxLength: 100 }
    UpdateRoleRequest:
      type: object
      required: [roleName, enabled, version]
      properties:
        roleName: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        version: { type: string, format: byte }
    DeleteVersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: string, format: byte, description: 由 8 字节 SQL Server 行版本号编码得到的 Base64 文本 }
    ReplacePermissionCodesRequest:
      type: object
      required: [permissionCodes]
      properties:
        permissionCodes: { type: array, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 64 } }
    PlatformInfoResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
    ExchangeRecordListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/ExchangeRecordSummary' }
    ExchangeRecordSummary:
      type: object
      required:
        - id
        - requestId
        - interfaceCode
        - organizationCode
        - sourceRecordId
        - callerSystemCode
        - targetSystemCode
        - receivedAt
      properties:
        id: { type: integer, format: int64 }
        requestId: { type: string }
        interfaceCode: { type: string }
        organizationCode: { type: string }
        sourceRecordId: { type: string }
        callerSystemCode: { type: string }
        targetSystemCode: { type: string }
        result:
          allOf:
            - $ref: '#/components/schemas/ExchangeResult'
          nullable: true
          description: 仅在增加最终结果字段之前创建的历史记录中可以为空
        targetResultCode: { type: string, nullable: true }
        resultMessage: { type: string, nullable: true }
        durationMs: { type: integer, format: int64, minimum: 0, nullable: true }
        requestSummary:
          type: string
          nullable: true
          description: 已删除或遮盖身份和敏感字段的摘要，不包含完整临床正文
        communicationErrorSummary:
          type: string
          nullable: true
          description: 通信错误摘要，不包含凭证或内部地址详情
        receivedAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time, nullable: true }
    ExchangeResult:
      type: string
      description: 交换的最终处理结果，不表示发送过程进行到哪一步
      enum: [SUCCESS, FAILURE, NO_RESPONSE]
    OrganizationListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
    OrganizationResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/Organization' }
    Organization:
      type: object
      required:
        - id
        - organizationCode
        - organizationName
        - organizationType
        - enabled
        - createdAt
        - updatedAt
        - version
      properties:
        id: { type: integer, format: int64 }
        organizationCode: { type: string, maxLength: 64 }
        organizationName: { type: string, maxLength: 200 }
        organizationType:
          type: string
          maxLength: 32
          description: 项目已确认的机构类型代码；本接口定义不自行增加取值
        parentId: { type: integer, format: int64, nullable: true }
        enabled: { type: boolean }
        validFrom: { type: string, format: date-time, nullable: true, description: UTC }
        validTo: { type: string, format: date-time, nullable: true, description: UTC }
        createdAt: { type: string, format: date-time, description: UTC }
        updatedAt: { type: string, format: date-time, description: UTC }
        version:
          type: string
          format: byte
          description: 由 8 字节 SQL Server 行版本号编码得到的 Base64 文本
    CreateOrganizationRequest:
      type: object
      required: [organizationCode, organizationName, organizationType, parentId]
      properties:
        organizationCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        organizationType: { type: string, minLength: 1, maxLength: 32 }
        parentId:
          type: integer
          format: int64
          minimum: 1
          description: 日常管理必须提供；只有一次性初始化可以创建根机构
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
    UpdateOrganizationRequest:
      type: object
      required: [organizationName, organizationType, version]
      properties:
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        organizationType: { type: string, minLength: 1, maxLength: 32 }
        parentId: { type: integer, format: int64, minimum: 1, nullable: true }
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
        version: { type: string, format: byte, description: 由 8 字节 SQL Server 行版本号编码得到的 Base64 文本 }
    ChangeOrganizationEnabledRequest:
      type: object
      required: [enabled, version]
      properties:
        enabled: { type: boolean }
        version: { type: string, format: byte, description: 由 8 字节 SQL Server 行版本号编码得到的 Base64 文本 }
    ParameterDefinitionListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ParameterDefinition' } }
    ParameterDefinition:
      type: object
      required: [key, name, valueType, environments, organizationScoped, sensitive]
      properties:
        key: { type: string, maxLength: 64 }
        name: { type: string }
        valueType: { type: string, enum: [STRING, INTEGER, DECIMAL, BOOLEAN] }
        environments:
          type: array
          uniqueItems: true
          items: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationScoped: { type: boolean }
        sensitive: { type: boolean }
        maximumLength: { type: integer, nullable: true }
        minimumNumber: { type: number, nullable: true }
        maximumNumber: { type: number, nullable: true }
        pattern: { type: string, nullable: true }
    UpsertParameterRequest:
      type: object
      required: [environment, value, enabled]
      properties:
        environment: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationId: { type: integer, format: int64, minimum: 1, nullable: true }
        value:
          type: string
          maxLength: 1000
          writeOnly: true
          description: 按代码中登记的参数定义校验；不得包含外部系统的明文凭证
        enabled: { type: boolean }
        version:
          type: string
          format: byte
          nullable: true
          description: 仅在首次创建该环境和机构对应的参数值时可以省略
    DeleteParameterRequest:
      type: object
      required: [environment, version]
      properties:
        environment: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationId: { type: integer, format: int64, minimum: 1, nullable: true }
        version: { type: string, format: byte, description: 由 8 字节 SQL Server 行版本号编码得到的 Base64 文本 }
    ParameterValueListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ParameterValue' } }
    ParameterValueResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/ParameterValue' }
    ParameterValue:
      type: object
      required: [id, parameterKey, valueType, environment, value, configured, enabled, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        parameterKey: { type: string }
        valueType: { type: string, enum: [STRING, INTEGER, DECIMAL, BOOLEAN] }
        environment: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationId: { type: integer, format: int64, nullable: true }
        organizationCode: { type: string, nullable: true }
        value:
          type: string
          description: 敏感参数固定返回的遮盖符号；不能通过该字段恢复原值
        configured: { type: boolean }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time, description: UTC }
        version: { type: string, format: byte }
    DictionaryTypeListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/DictionaryType' } }
