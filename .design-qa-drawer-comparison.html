<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外部系统抽屉修正对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #eef2f3; color: #20333e; font: 14px/1.5 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    section { min-width: 0; padding: 14px; border: 1px solid #d8e1e4; border-radius: 8px; background: #fff; }
    h2 { margin: 0 0 10px; font-size: 15px; }
    img { width: 100%; height: auto; border: 1px solid #e2e8ea; display: block; }
  </style>
</head>
<body>
  <main>
    <section><h2>修改前 · 机构连接</h2><img src=".design-qa-endpoint-drawer-source.png" alt="修改前机构连接抽屉" /></section>
    <section><h2>修改后 · 机构连接</h2><img src=".design-qa-endpoint-drawer.jpg" alt="修改后机构连接抽屉" /></section>
    <section><h2>修改前 · 系统资料</h2><img src=".design-qa-system-drawer-source.png" alt="修改前系统资料抽屉" /></section>
    <section><h2>修改后 · 系统资料</h2><img src=".design-qa-system-drawer.jpg" alt="修改后系统资料抽屉" /></section>
  </main>
</body>
</html>
