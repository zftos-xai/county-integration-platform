services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      PLATFORM_DB_URL: ${PLATFORM_DB_URL:?PLATFORM_DB_URL must be set}
      PLATFORM_DB_USERNAME: ${PLATFORM_DB_USERNAME:?PLATFORM_DB_USERNAME must be set}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
      PLATFORM_DB_MIGRATION_USERNAME: ${PLATFORM_DB_MIGRATION_USERNAME:?PLATFORM_DB_MIGRATION_USERNAME must be set}
      PLATFORM_DB_MIGRATION_PASSWORD: ${PLATFORM_DB_MIGRATION_PASSWORD:?PLATFORM_DB_MIGRATION_PASSWORD must be set}
      PLATFORM_DB_MIGRATION_ENABLED: ${PLATFORM_DB_MIGRATION_ENABLED:-true}
      PLATFORM_DATABASE_CONTRACT_ENABLED: ${PLATFORM_DATABASE_CONTRACT_ENABLED:-true}
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET:-}
      PLATFORM_SESSION_TIMEOUT: ${PLATFORM_SESSION_TIMEOUT:-30m}
      PLATFORM_SESSION_COOKIE_SECURE: ${PLATFORM_SESSION_COOKIE_SECURE:-false}
      PLATFORM_SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
