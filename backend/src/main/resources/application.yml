spring:
  application:
    name: county-integration-platform
  datasource:
    url: ${PLATFORM_DB_URL}
    username: ${PLATFORM_DB_USERNAME}
    password: ${PLATFORM_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${PLATFORM_DB_POOL_MAX:20}
      minimum-idle: ${PLATFORM_DB_POOL_MIN:2}
      connection-timeout: 10000
  flyway:
    enabled: ${PLATFORM_DB_MIGRATION_ENABLED:true}
    user: ${PLATFORM_DB_MIGRATION_USERNAME:${PLATFORM_DB_USERNAME}}
    password: ${PLATFORM_DB_MIGRATION_PASSWORD:${PLATFORM_DB_PASSWORD}}
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath*:mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: ${PLATFORM_SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${PLATFORM_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${PLATFORM_SESSION_COOKIE_SECURE:false}
        same-site: strict

platform:
  security:
    bootstrap-secret: ${PLATFORM_BOOTSTRAP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    root: INFO
    cn.zqkj.platform: INFO
