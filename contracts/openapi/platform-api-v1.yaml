openapi: 3.0.3
info:
  title: County Integration Platform API
  version: 0.1.0
  description: >-
    Internal management API baseline. Business interfaces may be implemented only
    after their formal contracts, de-identified samples, network access and owners are confirmed.
servers:
  - url: /api/v1
security:
  - hospitalIdentity: []
paths:
  /bootstrap/status:
    get:
      security: []
      operationId: getBootstrapStatus
      summary: Read whether one-time platform bootstrap is available
      responses:
        '200':
          description: Bootstrap status without credential content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapStatusResponse' }
  /bootstrap:
    post:
      security: []
      operationId: bootstrapPlatform
      summary: Create the first organization and local administrator exactly once
      parameters:
        - name: X-Platform-Bootstrap-Secret
          in: header
          required: true
          description: One-time secret supplied only through the approved deployment channel
          schema: { type: string, minLength: 32 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapRequest' }
      responses:
        '201': { description: Initial organization and administrator created }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: Bootstrap is unavailable or the one-time secret is invalid }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /session/csrf:
    get:
      security: []
      operationId: getCsrfToken
      summary: Obtain the CSRF token required for state-changing management requests
      responses:
        '200':
          description: CSRF token and request header name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenResponse' }
  /session/login:
    post:
      security: []
      operationId: login
      summary: Establish a server-side local-management session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { description: Login name or password is invalid }
  /session/current:
    get:
      operationId: getCurrentUser
      summary: Read the current authenticated management user
      responses:
        '200':
          description: Current user without password or session identifier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /session/logout:
    post:
      operationId: logout
      summary: Invalidate the current management session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': { description: Session invalidated }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /session/password:
    post:
      operationId: changeCurrentPassword
      summary: Change the current local password and invalidate the current session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: Password changed; the user must log in again }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      operationId: listUsers
      summary: List users whose primary organization is in the current organization scope
      responses:
        '200':
          description: Visible platform users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '403': { description: 'identity:read permission is required' }
    post:
      operationId: createUser
      summary: Create a local user in an authorized organization
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201': { description: User created with mandatory password change }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'identity:write permission and organization scope are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getUser
      summary: Read an authorized platform user
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '403': { description: 'identity:read permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    put:
      operationId: updateUser
      summary: Update user display name and primary organization
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200': { description: User updated }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'identity:write permission and both organization scopes are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /users/{userId}/enabled:
    patch:
      operationId: changeUserEnabled
      summary: Enable or disable a user while protecting the last administrator
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeEnabledRequest' }
      responses:
        '200': { description: User state changed }
        '403': { description: 'identity:write permission and organization scope are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /users/{userId}/password-reset:
    post:
      operationId: resetUserPassword
      summary: Set a temporary password and invalidate the user's effective session permissions
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Temporary password set }
        '403': { description: 'identity:write permission and organization scope are required' }
  /users/{userId}/roles:
    put:
      operationId: replaceUserRoles
      summary: Atomically replace user roles while protecting the last administrator
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceRoleIdsRequest' }
      responses:
        '200': { description: User roles replaced }
        '403': { description: 'access:write permission and organization scope are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /users/{userId}/organization-scopes:
    put:
      operationId: replaceUserOrganizationScopes
      summary: Atomically replace explicit organization scopes within the actor's own scope
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceOrganizationIdsRequest' }
      responses:
        '200': { description: Organization scopes replaced }
        '403': { description: 'access:write permission and all organization scopes are required' }
  /roles:
    get:
      operationId: listRoles
      summary: List platform roles and registered permissions
      responses:
        '200':
          description: Platform roles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListResponse' }
        '403': { description: 'access:read permission is required' }
    post:
      operationId: createRole
      summary: Create a non-system platform role
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201': { description: Role created }
        '403': { description: 'access:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getRole
      summary: Read a platform role
      responses:
        '200': { description: Role detail }
        '403': { description: 'access:read permission is required' }
    put:
      operationId: updateRole
      summary: Update a non-system role
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200': { description: Role updated }
        '403': { description: 'access:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /roles/{roleId}/permissions:
    put:
      operationId: replaceRolePermissions
      summary: Replace registered permissions on a non-system role
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacePermissionCodesRequest' }
      responses:
        '200': { description: Role permissions replaced }
        '403': { description: 'access:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /permissions:
    get:
      operationId: listRegisteredPermissions
      summary: List permissions registered by backend code
      responses:
        '200': { description: Registered permission list }
        '403': { description: 'access:read permission is required' }
  /system/info:
    get:
      operationId: getPlatformInfo
      summary: Read the running platform baseline
      responses:
        '200':
          description: Platform information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /exchange-records:
    get:
      operationId: findRecentExchangeRecords
      summary: List recent exchange records for an authorized organization
      parameters:
        - name: organizationCode
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: receivedFrom
          in: query
          required: false
          description: UTC lower bound of the record received time, inclusive
          schema: { type: string, format: date-time }
        - name: receivedTo
          in: query
          required: false
          description: UTC upper bound of the record received time, inclusive
          schema: { type: string, format: date-time }
        - name: interfaceCode
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: sourceRecordId
          in: query
          required: false
          description: Business record reference without clinical content
          schema: { type: string, maxLength: 128 }
        - name: requestId
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: result
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ExchangeResult' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Exchange records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRecordListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organization or data scope is not authorized
  /organizations:
    get:
      operationId: listOrganizations
      summary: List platform-managed organizations
      parameters:
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Organizations visible to the authenticated administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:read permission is required' }
    post:
      operationId: createOrganization
      summary: Create a platform-managed organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getOrganization
      summary: Read a platform-managed organization
      responses:
        '200':
          description: Organization found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:read permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    put:
      operationId: updateOrganization
      summary: Update a platform-managed organization using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganizationRequest' }
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /organizations/{id}/enabled:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    patch:
      operationId: changeOrganizationEnabled
      summary: Enable or disable a platform-managed organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeOrganizationEnabledRequest' }
      responses:
        '200':
          description: Organization state changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'organization:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/parameter-definitions:
    get:
      operationId: listParameterDefinitions
      summary: List code-registered platform parameter metadata
      responses:
        '200':
          description: Registered metadata used to build explicit management forms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterDefinitionListResponse' }
        '403': { description: 'configuration:read permission is required' }
  /configuration/parameters:
    get:
      operationId: listParameterValues
      summary: List global and authorized organization-scoped parameter values
      responses:
        '200':
          description: Parameter values visible to the authenticated administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterValueListResponse' }
        '403': { description: 'configuration:read permission is required' }
  /configuration/parameters/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z][a-z0-9_.-]*$' }
    put:
      operationId: upsertParameterValue
      summary: Create or concurrently update a value for a code-registered parameter
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertParameterRequest' }
      responses:
        '200':
          description: Parameter value saved; sensitive values are masked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterValueResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission and organization scope are required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/dictionaries:
    get:
      operationId: listDictionaryTypes
      summary: List platform system dictionary types
      responses:
        '200':
          description: Platform system dictionary types
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryTypeListResponse' }
        '403': { description: 'configuration:read permission is required' }
    post:
      operationId: createDictionaryType
      summary: Create a platform system dictionary type
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDictionaryTypeRequest' }
      responses:
        '201':
          description: Dictionary type created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryTypeResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/dictionaries/{typeId}:
    parameters:
      - name: typeId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: updateDictionaryType
      summary: Concurrently update or disable a platform system dictionary type
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDictionaryTypeRequest' }
      responses:
        '200':
          description: Dictionary type updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryTypeResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/dictionaries/{typeId}/items:
    parameters:
      - name: typeId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: listDictionaryItems
      summary: List items in a platform system dictionary type
      parameters:
        - name: includeDisabled
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Dictionary items ordered by sort order and item code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItemListResponse' }
        '403': { description: 'configuration:read permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    post:
      operationId: createDictionaryItem
      summary: Add an item to an enabled platform system dictionary type
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDictionaryItemRequest' }
      responses:
        '201':
          description: Dictionary item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItemResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/dictionary-items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: updateDictionaryItem
      summary: Concurrently update or disable a platform system dictionary item
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDictionaryItemRequest' }
      responses:
        '200':
          description: Dictionary item updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItemResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/external-systems:
    get:
      operationId: listExternalSystems
      summary: List confirmed external systems
      responses:
        '200': { description: External systems, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSystemListResponse' } } } }
        '403': { description: 'configuration:read permission is required' }
    post:
      operationId: createExternalSystem
      summary: Register a confirmed external system
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExternalSystemRequest' } } } }
      responses:
        '201': { description: External system created, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSystemResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/external-systems/{systemId}:
    parameters:
      - { name: systemId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: updateExternalSystem
      summary: Concurrently update or disable an external system
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateExternalSystemRequest' } } } }
      responses:
        '200': { description: External system updated, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSystemResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission is required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/external-systems/{systemId}/endpoints:
    parameters:
      - { name: systemId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: listExternalEndpoints
      summary: List global and authorized organization-scoped endpoints
      responses:
        '200': { description: Safe endpoint metadata without credential references, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalEndpointListResponse' } } } }
        '403': { description: 'configuration:read permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    post:
      operationId: createExternalEndpoint
      summary: Create a disabled endpoint for later review and enablement
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExternalEndpointRequest' } } } }
      responses:
        '201': { description: Disabled endpoint created, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalEndpointResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /configuration/external-endpoints/{endpointId}:
    parameters:
      - { name: endpointId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: updateExternalEndpoint
      summary: Concurrently update or enable an authorized endpoint
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateExternalEndpointRequest' } } } }
      responses:
        '200': { description: Safe endpoint metadata without credential reference, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalEndpointResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { description: 'configuration:write permission and organization scope are required' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /audit/events:
    get:
      operationId: listManagementAuditEvents
      summary: List management audit events visible in the current organization scope
      parameters:
        - { name: targetType, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: targetId, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Time-descending, redacted audit events, content: { application/json: { schema: { $ref: '#/components/schemas/ManagementAuditEventListResponse' } } } }
        '403': { description: 'audit:read permission is required' }
components:
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token returned by GET /session/csrf and paired with the XSRF-TOKEN cookie
      schema: { type: string }
  securitySchemes:
    hospitalIdentity:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        Contract marker for an authenticated management session. The first development
        phase uses a server-side local-management session and secure HttpOnly cookie;
        production identity must be reviewed by the hospital before activation.
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Authentication is required
    ResourceNotFound:
      description: The requested platform resource does not exist or is not visible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ResourceConflict:
      description: Unique data, current state, or optimistic concurrency version conflicts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    BootstrapStatusResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: object
          required: [initialized, bootstrapAvailable]
          properties:
            initialized: { type: boolean }
            bootstrapAvailable: { type: boolean }
    BootstrapRequest:
      type: object
      required: [organizationCode, organizationName, organizationType, loginName, displayName, initialPassword]
      properties:
        organizationCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        organizationType: { type: string, minLength: 1, maxLength: 32 }
        loginName: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        initialPassword: { type: string, minLength: 12, maxLength: 128, format: password, writeOnly: true }
    LoginRequest:
      type: object
      required: [loginName, password]
      properties:
        loginName: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128, format: password, writeOnly: true }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, format: password, writeOnly: true }
        newPassword: { type: string, minLength: 12, maxLength: 128, format: password, writeOnly: true }
    CurrentUserResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/CurrentUser' }
    CurrentUser:
      type: object
      required: [userId, loginName, displayName, primaryOrganizationId, organizationCode, mustChangePassword, permissions, organizationCodes]
      properties:
        userId: { type: integer, format: int64 }
        loginName: { type: string }
        displayName: { type: string }
        primaryOrganizationId: { type: integer, format: int64 }
        organizationCode: { type: string }
        mustChangePassword: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        organizationCodes:
          type: array
          description: Explicit enabled organization scopes; parent scope does not imply descendant scope
          items: { type: string }
    CsrfTokenResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: object
          required: [headerName, parameterName, token]
          properties:
            headerName: { type: string, example: X-XSRF-TOKEN }
            parameterName: { type: string, example: _csrf }
            token: { type: string }
    UserListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/ManagedUser' }
    UserResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/ManagedUser' }
    ManagedUser:
      type: object
      required: [id, loginName, displayName, primaryOrganizationId, organizationCode, enabled, mustChangePassword, createdAt, updatedAt, version, roleIds, organizationScopeIds]
      properties:
        id: { type: integer, format: int64 }
        loginName: { type: string }
        displayName: { type: string }
        primaryOrganizationId: { type: integer, format: int64 }
        organizationCode: { type: string }
        enabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: string, format: byte }
        roleIds: { type: array, items: { type: integer, format: int64 } }
        organizationScopeIds: { type: array, items: { type: integer, format: int64 } }
    CreateUserRequest:
      type: object
      required: [loginName, displayName, primaryOrganizationId, temporaryPassword]
      properties:
        loginName: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        primaryOrganizationId: { type: integer, format: int64, minimum: 1 }
        temporaryPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128 }
    UpdateUserRequest:
      type: object
      required: [displayName, primaryOrganizationId, version]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        primaryOrganizationId: { type: integer, format: int64, minimum: 1 }
        version: { type: string, format: byte }
    ChangeEnabledRequest:
      type: object
      required: [enabled, version]
      properties:
        enabled: { type: boolean }
        version: { type: string, format: byte }
    ResetPasswordRequest:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128 }
    ReplaceRoleIdsRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds: { type: array, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
    ReplaceOrganizationIdsRequest:
      type: object
      required: [organizationIds]
      properties:
        organizationIds: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
    RoleListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/Role' } }
    Role:
      type: object
      required: [id, roleCode, roleName, enabled, systemManaged, createdAt, updatedAt, version, permissionCodes]
      properties:
        id: { type: integer, format: int64 }
        roleCode: { type: string }
        roleName: { type: string }
        enabled: { type: boolean }
        systemManaged: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: string, format: byte }
        permissionCodes: { type: array, items: { type: string } }
    CreateRoleRequest:
      type: object
      required: [roleCode, roleName]
      properties:
        roleCode: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Z][A-Z0-9_]+$' }
        roleName: { type: string, minLength: 1, maxLength: 100 }
    UpdateRoleRequest:
      type: object
      required: [roleName, enabled, version]
      properties:
        roleName: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        version: { type: string, format: byte }
    ReplacePermissionCodesRequest:
      type: object
      required: [permissionCodes]
      properties:
        permissionCodes: { type: array, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 64 } }
    PlatformInfoResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
    ExchangeRecordListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/ExchangeRecordSummary' }
    ExchangeRecordSummary:
      type: object
      required:
        - id
        - requestId
        - interfaceCode
        - organizationCode
        - sourceRecordId
        - callerSystemCode
        - targetSystemCode
        - receivedAt
      properties:
        id: { type: integer, format: int64 }
        requestId: { type: string }
        interfaceCode: { type: string }
        organizationCode: { type: string }
        sourceRecordId: { type: string }
        callerSystemCode: { type: string }
        targetSystemCode: { type: string }
        result:
          allOf:
            - $ref: '#/components/schemas/ExchangeResult'
          nullable: true
          description: Null only for legacy records that predate the final-result migration
        targetResultCode: { type: string, nullable: true }
        resultMessage: { type: string, nullable: true }
        durationMs: { type: integer, format: int64, minimum: 0, nullable: true }
        requestSummary:
          type: string
          nullable: true
          description: De-identified summary without complete clinical payload
        communicationErrorSummary:
          type: string
          nullable: true
          description: Communication error without credentials or internal address details
        receivedAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time, nullable: true }
    ExchangeResult:
      type: string
      description: Final exchange fact; never a transport-process state
      enum: [SUCCESS, FAILURE, NO_RESPONSE]
    OrganizationListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
    OrganizationResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/Organization' }
    Organization:
      type: object
      required:
        - id
        - organizationCode
        - organizationName
        - organizationType
        - enabled
        - createdAt
        - updatedAt
        - version
      properties:
        id: { type: integer, format: int64 }
        organizationCode: { type: string, maxLength: 64 }
        organizationName: { type: string, maxLength: 200 }
        organizationType:
          type: string
          maxLength: 32
          description: Project-confirmed organization type code; values are not invented by this contract
        parentId: { type: integer, format: int64, nullable: true }
        enabled: { type: boolean }
        validFrom: { type: string, format: date-time, nullable: true, description: UTC }
        validTo: { type: string, format: date-time, nullable: true, description: UTC }
        createdAt: { type: string, format: date-time, description: UTC }
        updatedAt: { type: string, format: date-time, description: UTC }
        version:
          type: string
          format: byte
          description: Base64-encoded 8-byte SQL Server rowversion
    CreateOrganizationRequest:
      type: object
      required: [organizationCode, organizationName, organizationType, parentId]
      properties:
        organizationCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        organizationType: { type: string, minLength: 1, maxLength: 32 }
        parentId:
          type: integer
          format: int64
          minimum: 1
          description: Required for normal management; only one-time bootstrap creates the root organization
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
    UpdateOrganizationRequest:
      type: object
      required: [organizationName, organizationType, version]
      properties:
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        organizationType: { type: string, minLength: 1, maxLength: 32 }
        parentId: { type: integer, format: int64, minimum: 1, nullable: true }
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
        version: { type: string, format: byte, description: Base64-encoded 8-byte SQL Server rowversion }
    ChangeOrganizationEnabledRequest:
      type: object
      required: [enabled, version]
      properties:
        enabled: { type: boolean }
        version: { type: string, format: byte, description: Base64-encoded 8-byte SQL Server rowversion }
    ParameterDefinitionListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ParameterDefinition' } }
    ParameterDefinition:
      type: object
      required: [key, name, valueType, environments, organizationScoped, sensitive]
      properties:
        key: { type: string, maxLength: 64 }
        name: { type: string }
        valueType: { type: string, enum: [STRING, INTEGER, DECIMAL, BOOLEAN] }
        environments:
          type: array
          uniqueItems: true
          items: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationScoped: { type: boolean }
        sensitive: { type: boolean }
        maximumLength: { type: integer, nullable: true }
        minimumNumber: { type: number, nullable: true }
        maximumNumber: { type: number, nullable: true }
        pattern: { type: string, nullable: true }
    UpsertParameterRequest:
      type: object
      required: [environment, value, enabled]
      properties:
        environment: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationId: { type: integer, format: int64, minimum: 1, nullable: true }
        value:
          type: string
          maxLength: 1000
          writeOnly: true
          description: Validated against code-registered metadata; must never contain an external-system plaintext credential
        enabled: { type: boolean }
        version:
          type: string
          format: byte
          nullable: true
          description: Omit only when creating a previously absent scope value
    ParameterValueListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ParameterValue' } }
    ParameterValueResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/ParameterValue' }
    ParameterValue:
      type: object
      required: [id, parameterKey, valueType, environment, value, configured, enabled, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        parameterKey: { type: string }
        valueType: { type: string, enum: [STRING, INTEGER, DECIMAL, BOOLEAN] }
        environment: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationId: { type: integer, format: int64, nullable: true }
        organizationCode: { type: string, nullable: true }
        value:
          type: string
          description: Fixed mask for sensitive definitions; never use this field to recover a secret
        configured: { type: boolean }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time, description: UTC }
        version: { type: string, format: byte }
    DictionaryTypeListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/DictionaryType' } }
    DictionaryTypeResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/DictionaryType' }
    DictionaryType:
      type: object
      required: [id, typeCode, typeName, description, enabled, createdAt, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        typeCode: { type: string, maxLength: 64 }
        typeName: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, description: UTC }
        updatedAt: { type: string, format: date-time, description: UTC }
        version: { type: string, format: byte }
    CreateDictionaryTypeRequest:
      type: object
      required: [typeCode, typeName, description]
      properties:
        typeCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z][A-Za-z0-9_.-]*$' }
        typeName: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
    UpdateDictionaryTypeRequest:
      type: object
      required: [typeName, description, enabled, version]
      properties:
        typeName: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        enabled: { type: boolean }
        version: { type: string, format: byte }
    DictionaryItemListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/DictionaryItem' } }
    DictionaryItemResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/DictionaryItem' }
    DictionaryItem:
      type: object
      required: [id, dictionaryTypeId, itemCode, itemLabel, sortOrder, enabled, createdAt, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        dictionaryTypeId: { type: integer, format: int64 }
        itemCode: { type: string, maxLength: 64 }
        itemLabel: { type: string, maxLength: 200 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, description: UTC }
        updatedAt: { type: string, format: date-time, description: UTC }
        version: { type: string, format: byte }
    CreateDictionaryItemRequest:
      type: object
      required: [itemCode, itemLabel, sortOrder]
      properties:
        itemCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z][A-Za-z0-9_.-]*$' }
        itemLabel: { type: string, minLength: 1, maxLength: 200 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
    UpdateDictionaryItemRequest:
      type: object
      required: [itemLabel, sortOrder, enabled, version]
      properties:
        itemLabel: { type: string, minLength: 1, maxLength: 200 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
        enabled: { type: boolean }
        version: { type: string, format: byte }
    ExternalSystemListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ExternalSystem' } }
    ExternalSystemResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/ExternalSystem' }
    ExternalSystem:
      type: object
      required: [id, systemCode, systemName, description, enabled, createdAt, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        systemCode: { type: string, maxLength: 64 }
        systemName: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, description: UTC }
        updatedAt: { type: string, format: date-time, description: UTC }
        version: { type: string, format: byte }
    CreateExternalSystemRequest:
      type: object
      required: [systemCode, systemName, description]
      properties:
        systemCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z][A-Za-z0-9_.-]*$' }
        systemName: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
    UpdateExternalSystemRequest:
      type: object
      required: [systemName, description, enabled, version]
      properties:
        systemName: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        enabled: { type: boolean }
        version: { type: string, format: byte }
    ExternalEndpointListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ExternalEndpoint' } }
    ExternalEndpointResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { $ref: '#/components/schemas/ExternalEndpoint' }
    ExternalEndpoint:
      type: object
      required: [id, externalSystemId, environment, baseUrl, connectTimeoutMs, readTimeoutMs, credentialConfigured, enabled, createdAt, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        externalSystemId: { type: integer, format: int64 }
        environment: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationId: { type: integer, format: int64, nullable: true }
        organizationCode: { type: string, nullable: true }
        baseUrl: { type: string, format: uri, pattern: '^https://' }
        connectTimeoutMs: { type: integer, minimum: 100, maximum: 60000 }
        readTimeoutMs: { type: integer, minimum: 100, maximum: 300000 }
        credentialConfigured: { type: boolean, description: The credential reference itself is never returned }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, description: UTC }
        updatedAt: { type: string, format: date-time, description: UTC }
        version: { type: string, format: byte }
    CreateExternalEndpointRequest:
      type: object
      required: [environment, baseUrl, connectTimeoutMs, readTimeoutMs, credentialReference]
      properties:
        environment: { type: string, enum: [DEVELOPMENT, TEST, PRODUCTION] }
        organizationId: { type: integer, format: int64, minimum: 1, nullable: true }
        baseUrl: { type: string, format: uri, maxLength: 500, pattern: '^https://' }
        connectTimeoutMs: { type: integer, minimum: 100, maximum: 60000 }
        readTimeoutMs: { type: integer, minimum: 100, maximum: 300000 }
        credentialReference: { type: string, minLength: 1, maxLength: 200, writeOnly: true, description: Approved secret-store reference URI; never a plaintext credential }
    UpdateExternalEndpointRequest:
      type: object
      required: [baseUrl, connectTimeoutMs, readTimeoutMs, credentialReference, enabled, version]
      properties:
        baseUrl: { type: string, format: uri, maxLength: 500, pattern: '^https://' }
        connectTimeoutMs: { type: integer, minimum: 100, maximum: 60000 }
        readTimeoutMs: { type: integer, minimum: 100, maximum: 300000 }
        credentialReference: { type: string, minLength: 1, maxLength: 200, writeOnly: true, description: Approved secret-store reference URI; never returned }
        enabled: { type: boolean }
        version: { type: string, format: byte }
    ManagementAuditEventListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ManagementAuditEvent' } }
    ManagementAuditEvent:
      type: object
      required: [id, occurredAt, actorLogin, actionCode, targetType, targetId, resultCode, changeSummary]
      properties:
        id: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time, description: UTC }
        actorLogin: { type: string, description: Trusted login snapshot or masked hint for an authentication failure }
        organizationCode: { type: string, nullable: true }
        actionCode: { type: string, maxLength: 64 }
        targetType: { type: string, maxLength: 64 }
        targetId: { type: string, maxLength: 128 }
        resultCode: { type: string, enum: [SUCCESS, FAILURE] }
        changeSummary: { type: string, maxLength: 1000, description: Redacted summary without credentials or business content }
        requestId: { type: string, maxLength: 64, nullable: true }
    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
